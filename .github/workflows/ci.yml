name: ci

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    name: Build and check
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~\.nuget\packages
          key: nuget-${{ hashFiles('**/*.csproj', 'Directory.Build.props') }}
          restore-keys: nuget-

      - name: Build
        run: dotnet build Lychee.sln -c Release -p:Platform=x64 --nologo

      - name: Checks
        run: dotnet run --project tests/Lychee.Checks -c Release --nologo
